<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista de Canción - Grupo de Alabanza</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <h1>🎵 Grupo de Alabanza</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="canciones.html" class="active">Canciones</a></li>
                <li><a href="setlists.html">Setlists</a></li>
                <li><a href="equipo.html">Equipo</a></li>
            </ul>
            <div class="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="song-controls">
            <div class="control-buttons">
                <button id="transpose-up" class="control-btn">🔺 +1</button>
                <button id="transpose-down" class="control-btn">🔻 -1</button>
                <button id="toggle-dark" class="control-btn">🌙 Modo Oscuro</button>
                <button id="toggle-chords" class="control-btn">🎸 Solo Acordes</button>
                <button id="toggle-lyrics" class="control-btn">📝 Solo Letra</button>
                <button id="toggle-scroll" class="control-btn">⏯️ Auto Scroll</button>
                <button id="back-to-list" class="control-btn">← Volver</button>
            </div>
            <div class="song-info">
                <h1 id="song-title">Cargando...</h1>
                <p id="song-artist">Artista: <span></span></p>
                <p id="song-key">Tonalidad: <span></span></p>
                <p id="song-bpm">BPM: <span></span></p>
                <a id="youtube-link" href="#" target="_blank" class="youtube-link" style="display: none;">▶️ Ver en YouTube</a>
            </div>
        </section>

        <section class="song-content" id="song-content">
            <div class="loading">
                <p>Cargando canción...</p>
            </div>
        </section>

        <div class="error-message" id="error-message" style="display: none;">
            <p>No se pudo cargar la canción solicitada.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Grupo de Alabanza - Sistema de Gestión Musical</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
